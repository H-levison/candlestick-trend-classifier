# Re-resolves the "api" service name every 5s via Docker's embedded DNS (127.0.0.11)
# instead of caching it once at startup, so nginx picks up new replicas whenever
# the api service is scaled with `docker-compose up --scale api=N`, without a restart.
resolver 127.0.0.11 valid=5s;

server {
    listen 80;

    location / {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
