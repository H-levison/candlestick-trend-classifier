# Re-resolves the "api" service name every 5s via Docker's embedded DNS (127.0.0.11)
# instead of caching it once at startup, so nginx picks up new replicas whenever
# the api service is scaled with `docker-compose up --scale api=N`, without a restart.
resolver 127.0.0.11 valid=5s;

server {
    listen 80;

    location / {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /retrain fine-tunes on CPU and can run several minutes -- longer than
        # nginx's 60s default, which was causing 504s well before the request
        # actually failed. Matches the UI's own 600s client-side timeout.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
